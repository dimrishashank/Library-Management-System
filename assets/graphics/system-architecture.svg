<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="auto">
  <defs>
    <linearGradient id="lmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0E1726"/>
    </linearGradient>
    <linearGradient id="blueGlowBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="lmsGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="920" height="380" rx="12" fill="url(#lmsBg)"/>
  <rect width="920" height="380" rx="12" fill="url(#lmsGrid)"/>
  <rect x="1" y="1" width="918" height="378" rx="11" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="0" y="0" width="920" height="3" fill="url(#blueGlowBar)"/>

  <!-- Title Header -->
  <g transform="translate(40, 32)">
    <rect width="190" height="20" rx="4" fill="#0F172A" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="8" cy="10" r="2.5" fill="#60A5FA"/>
    <text x="16" y="14" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#93C5FD" letter-spacing="1">SYSTEM ARCHITECTURE</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">
      3-Tier Enterprise Architecture &amp; Data Access Object (DAO) Pattern
    </text>
  </g>

  <!-- ================= 3 ARCHITECTURAL TIERS ================= -->

  <!-- Tier 1: Presentation Layer (Java Swing) -->
  <g transform="translate(40, 105)">
    <rect width="840" height="65" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="1.2"/>
    <rect width="180" height="20" rx="4" fill="#1E293B" x="12" y="8"/>
    <text x="20" y="22" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#60A5FA">TIER 1: PRESENTATION LAYER</text>

    <!-- Component boxes inside Tier 1 -->
    <g transform="translate(12, 34)">
      <rect width="190" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="10" cy="11" r="3" fill="#60A5FA"/>
      <text x="20" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0">LoginFrame &amp; Auth Portal</text>

      <rect x="202" width="200" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="212" cy="11" r="3" fill="#A855F7"/>
      <text x="222" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0">AdminDashboard (RBAC Hub)</text>

      <rect x="414" width="200" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="424" cy="11" r="3" fill="#10B981"/>
      <text x="434" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0">LibrarianDashboard (Circulation)</text>

      <rect x="626" width="190" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="636" cy="11" r="3" fill="#F59E0B"/>
      <text x="646" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#E2E8F0">StudentDashboard (Hold/Fines)</text>
    </g>
  </g>

  <!-- Conduit 1: Security & RBAC Delegation -->
  <g transform="translate(460, 172)">
    <line x1="0" y1="0" x2="0" y2="24" stroke="#3B82F6" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="0,26 -3,20 3,20" fill="#3B82F6"/>
    <rect x="15" y="4" width="190" height="18" rx="3" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="16" font-family="'SF Mono', Consolas, monospace" font-size="8" fill="#94A3B8">ROLE-BASED METHOD DISPATCH</text>
  </g>

  <!-- Tier 2: Data Access Layer (DAO Pattern) -->
  <g transform="translate(40, 202)">
    <rect width="840" height="65" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.2"/>
    <rect width="215" height="20" rx="4" fill="#1E293B" x="12" y="8"/>
    <text x="20" y="22" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#34D399">TIER 2: DATA ACCESS OBJECT (DAO)</text>

    <!-- Component boxes inside Tier 2 -->
    <g transform="translate(12, 34)">
      <rect width="130" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="12" y="15" font-family="'SF Mono', Consolas, monospace" font-size="9.5" fill="#38BDF8">BookDAO</text>

      <rect x="138" width="130" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="148" y="15" font-family="'SF Mono', Consolas, monospace" font-size="9.5" fill="#38BDF8">IssuedBookDAO</text>

      <rect x="276" width="130" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="286" y="15" font-family="'SF Mono', Consolas, monospace" font-size="9.5" fill="#38BDF8">FineDAO</text>

      <rect x="414" width="130" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="424" y="15" font-family="'SF Mono', Consolas, monospace" font-size="9.5" fill="#38BDF8">UserDAO</text>

      <rect x="552" width="130" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="562" y="15" font-family="'SF Mono', Consolas, monospace" font-size="9.5" fill="#38BDF8">StudentDAO</text>

      <rect x="690" width="126" height="22" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="700" y="15" font-family="'SF Mono', Consolas, monospace" font-size="9.5" fill="#38BDF8">NotificationDAO</text>
    </g>
  </g>

  <!-- Conduit 2: JDBC Protocol & Connection Pool -->
  <g transform="translate(460, 269)">
    <line x1="0" y1="0" x2="0" y2="24" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="0,26 -3,20 3,20" fill="#10B981"/>
    <rect x="15" y="4" width="210" height="18" rx="3" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="16" font-family="'SF Mono', Consolas, monospace" font-size="8" fill="#94A3B8">JDBC PROTOCOL (DBUtil.getConnection)</text>
  </g>

  <!-- Tier 3: Persistence Layer (MySQL) -->
  <g transform="translate(40, 298)">
    <rect width="840" height="55" rx="8" fill="#111827" stroke="#F59E0B" stroke-width="1.2"/>
    <rect width="180" height="20" rx="4" fill="#1E293B" x="12" y="8"/>
    <text x="20" y="22" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#FBBF24">TIER 3: PERSISTENCE LAYER</text>

    <!-- Schema elements inside Tier 3 -->
    <text x="210" y="22" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#E2E8F0">
      MySQL 8.0 • Relational Tables: users • students • librarians • books • issued_books • fines • book_requests • notifications
    </text>
  </g>
</svg>
